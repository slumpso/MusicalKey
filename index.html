<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floating Blade</title>
<style>
:root{--bg:#020205;--fg:#dfe6f5;--dim:#7b86a3;--panel:rgba(10,12,22,.74);--edge:rgba(150,165,230,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020205}}
:root[data-theme="dark"]{--bg:#020205}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(700px,calc(100% - 24px));background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:opacity .6s}
#bar.hide{opacity:0}
button,label.btn{font:inherit;font-size:13px;color:var(--fg);background:rgba(120,130,200,.14);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button:hover,label.btn:hover{background:rgba(140,150,240,.28)}
input[type=file]{display:none}
#play{width:42px;padding:8px 0}
.seek{flex:1 1 160px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);min-width:150px}
input[type=range]{accent-color:#8b9bff;width:100%}
#panel{display:none;flex:1 1 100%;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;max-height:42vh;overflow:auto;padding:4px 2px 8px}
#panel.open{display:grid}
.sl{display:grid;grid-template-columns:104px 1fr 36px;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.sl b{font-weight:400;text-align:right;color:var(--fg)}
#panel .row{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);cursor:pointer}
#st{flex:1 1 100%;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);pointer-events:none;transition:opacity 1s}
#vig,#grain{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.9) 100%)}
#grain{mix-blend-mode:overlay;background-size:180px 180px}
#veil{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020205;cursor:pointer;transition:opacity .8s}
#veil.hide{opacity:0;pointer-events:none}
.keyhole{width:44px;height:57px;fill:#dfe6f5;filter:drop-shadow(0 0 14px rgba(170,185,255,.45))}
#veilTxt{margin-top:22px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#7b86a3}
</style>
</head>

<div id="vig"></div><div id="grain"></div>
<div id="veil"><svg class="keyhole" viewBox="0 0 100 130" aria-hidden="true"><path d="M50 6a30 30 0 0 1 16.5 55.1L77 117a5 5 0 0 1-4.9 6H27.9a5 5 0 0 1-4.9-6L33.5 61.1A30 30 0 0 1 50 6z"/></svg><div id="veilTxt">Loading…</div></div>

const spot=new THREE.SpotLight(0xfff0dc,3.2,14,.5,1,1.2);spot.position.set(0,4.4,.6);spot.target.position.set(0,-.2,0);scene.add(spot,spot.target);
scene.add(new THREE.HemisphereLight(0x394a7a,0x050508,.35));
const add=(g,f)=>new THREE.Mesh(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,uniforms:{uK:{value:1}},
  vertexShader:'varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vN=normalMatrix*normal;vec4 m=modelViewMatrix*vec4(position,1.);vV=-m.xyz;gl_Position=projectionMatrix*m;}',fragmentShader:'uniform float uK;'+f}));

const Q=innerWidth<700?.6:1;                                   // lower detail on phones
const CR=16,FLOOR=-2.3,YTOP=12,TILE=6;
const TB=new Float32Array(65536);for(let i=0;i<TB.length;i++)TB[i]=Math.random();
function vn(x,y,P){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const X0=((xi%P)+P)%P,Y0=((yi%P)+P)%P,X1=(X0+1)%P,Y1=(Y0+1)%P;
  const a=TB[X0+Y0*256],b=TB[X1+Y0*256],c=TB[X0+Y1*256],d=TB[X1+Y1*256];

  return L(L(L(q(0,0,0),q(1,0,0),u),L(q(0,1,0),q(1,1,0),u),v),L(L(q(0,0,1),q(1,0,1),u),L(q(0,1,1),q(1,1,1),u),v),w)}
const fb3=(x,y,z)=>n3(x,y,z)*.55+n3(x*2.1,y*2.1,z*2.1)*.3+n3(x*4.3,y*4.3,z*4.3)*.15;
function stoneTexture(N){const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N),d=im.data;

    for(let o=0;o<6;o++){f+=a*vn(u*fr,v*fr,fr);fr*=2;a*=.5}              // fine grain, periodic so tiles seamlessly

  const mid=(fb3(cx*1.9+7,y*.55,sz*1.9+7)-.5)*2.2;      // ledges and bulges

/* ---- dust motes that hang inside the spotlight cone and drift slowly ---- */
const ND=1400,dp=new Float32Array(ND*3),ds=new Float32Array(ND);
for(let i=0;i<ND;i++){const y=R(-2,4.2),ar=Math.sqrt(Math.random())*.5463*(4.4-y)*1.05,a=Math.random()*6.283;
  dp[i*3]=Math.cos(a)*ar;dp[i*3+1]=y;dp[i*3+2]=Math.sin(a)*ar+.6*(y+.2)/4.6;ds[i]=Math.random()}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));dg.setAttribute('aS',new THREE.BufferAttribute(ds,1));
const dustU={uT:{value:0},uDY:{value:0},uPx:{value:dpr},uK:{value:.2},uDust:{value:1},uL:{value:1},uLo:{value:-2},uHi:{value:4.4}};
const dust=new THREE.Points(dg,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:dustU,
 vertexShader:`attribute float aS;uniform float uT,uPx,uK,uDust,uL,uLo,uHi,uDY;varying float vA;
 void main(){float sp=.02+.035*aS;float y=uLo+mod(position.y-uLo+uT*sp,uHi-uLo);
   vec3 p=vec3(position.x+sin(uT*.15+aS*40.)*.07,y,position.z+cos(uT*.12+aS*31.)*.07);
   float ax=length(p.xz-vec2(0.,.6*(p.y+.2)/4.6));float allow=.5463*max(0.,4.4-p.y);
   float fall=clamp(1.-ax/max(allow,.001),0.,1.);
   float tw=.55+.45*sin(uT*(.7+aS*2.)+aS*60.);
   vec4 mv=modelViewMatrix*vec4(p+vec3(0.,uDY,0.),1.);
   vA=fall*fall*tw*uK*uDust*uL*2.;
   gl_PointSize=(1.5+3.5*aS)*uPx*(6./max(.5,-mv.z));
   gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`varying float vA;void main(){vec2 c=gl_PointCoord-.5;float d=dot(c,c)*4.;float a=exp(-d*3.)*(1.-smoothstep(.6,1.,d));gl_FragColor=vec4(vec3(1.,.92,.78)*a*vA,1.);}`}));
dust.frustumCulled=false;scene.add(dust);

/* ---- the object: a procedural sword until you load your own .glb ---- */
const holder=new THREE.Group();scene.add(holder);let model=null;
let SP=null,SN=null,SC=0;
function setModel(o){if(model)holder.remove(model);const s=new THREE.Vector3(),b=new THREE.Box3().setFromObject(o);b.getSize(s);
  o.scale.multiplyScalar(2.6/Math.max(s.x,s.y,s.z));b.setFromObject(o);o.position.sub(b.getCenter(new THREE.Vector3()));
  model=new THREE.Group();model.add(o);holder.add(model);holder.updateMatrixWorld(true);buildSamples();}
function buildSamples(){
  const ms=[];model.traverse(o=>{if(o.isMesh&&o.geometry.attributes.position)ms.push(o)});
  const tot=ms.reduce((a,m)=>a+m.geometry.attributes.position.count,0),inv=new THREE.Matrix4().copy(model.matrixWorld).invert(),nm=new THREE.Matrix3(),v=new THREE.Vector3();
  SC=Math.min(2500,tot);SP=new Float32Array(SC*3);SN=new Float32Array(SC*3);
  for(let q=0;q<SC;q++){let r=Math.random()*tot,m=ms[0];
    for(const x of ms){const c=x.geometry.attributes.position.count;if(r<c){m=x;break}r-=c}
    const g=m.geometry,i=Math.min(g.attributes.position.count-1,r|0),M=new THREE.Matrix4().multiplyMatrices(inv,m.matrixWorld);   // vertex -> model space
    v.fromBufferAttribute(g.attributes.position,i).applyMatrix4(M);SP[q*3]=v.x;SP[q*3+1]=v.y;SP[q*3+2]=v.z;
    if(g.attributes.normal){nm.getNormalMatrix(M);v.fromBufferAttribute(g.attributes.normal,i).applyMatrix3(nm).normalize()}else v.set(0,1,0);
    SN[q*3]=v.x;SN[q*3+1]=v.y;SN[q*3+2]=v.z}

/* load the model from the site: blade.glb (or model.glb). Play waits until this finishes.

(async()=>{let why='';

      const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
      for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;st('Loading model '+(tot?Math.round(got/tot*100)+'%':Math.round(got/1e6)+' MB'))}

/* ---- analysis: everything happens in the browser, nothing is uploaded ---- */
function fftSetup(N){const l=Math.log2(N),rev=new Uint16Array(N),cs=new Float32Array(N/2),sn=new Float32Array(N/2);
  for(let i=0;i<N;i++){let r=0;for(let b=0;b<l;b++)if(i>>b&1)r|=1<<(l-1-b);rev[i]=r}
  for(let i=0;i<N/2;i++){cs[i]=Math.cos(2*Math.PI*i/N);sn[i]=-Math.sin(2*Math.PI*i/N)}
  return(re,im)=>{for(let i=0;i<N;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let s=2;s<=N;s<<=1){const h=s>>1,sp=N/s;for(let i=0;i<N;i+=s)for(let k=0;k<h;k++){const a=i+k,b=a+h,wr=cs[k*sp],wi=sn[k*sp],xr=re[b]*wr-im[b]*wi,xi=re[b]*wi+im[b]*wr;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}}}
const p95=x=>{const s=Float32Array.from(x).sort();return s[Math.floor(s.length*.95)]||1e-9};
async function analyse(buf,prog){
  const sr=buf.sampleRate,N=1024,H=512,a=buf.getChannelData(0),b=buf.numberOfChannels>1?buf.getChannelData(1):a,nF=Math.max(16,Math.floor((a.length-N)/H)),fps=sr/H;
  const fft=fftSetup(N),re=new Float32Array(N),im=new Float32Array(N),mag=new Float32Array(N/2),prev=new Float32Array(N/2),win=new Float32Array(N).map((_,i)=>.5-.5*Math.cos(2*Math.PI*i/N));
  const hz=sr/N,ed=[[25,150],[150,600],[600,3500],[3500,14000]].map(([l,h])=>[Math.max(1,Math.round(l/hz)),Math.min(N/2-1,Math.round(h/hz))]);
  const E=ed.map(()=>new Float32Array(nF)),F=ed.map(()=>new Float32Array(nF));
  for(let f=0;f<nF;f++){
    for(let i=0;i<N;i++){re[i]=(a[f*H+i]+b[f*H+i])*.5*win[i];im[i]=0}
    fft(re,im);for(let i=0;i<N/2;i++)mag[i]=Math.hypot(re[i],im[i]);
    ed.forEach(([lo,hi],k)=>{let e=0,x=0;for(let i=lo;i<=hi;i++){e+=mag[i];const d=mag[i]-prev[i];if(d>0)x+=d}E[k][f]=e/(hi-lo+1);F[k][f]=x/(hi-lo+1)});
    prev.set(mag);if(f%250===0){prog(f/nF);await new Promise(r=>setTimeout(r))}
  }
  const ne=E.map(x=>{const p=p95(x);return x.map(v=>Math.min(1,v/p))}),ons=[];
  F.forEach((x,k)=>{const pk=p95(x),W=Math.round(.35*fps),gap=Math.round((k?.06:.1)*fps),pre=new Float64Array(nF+1);let last=-99;
    for(let i=0;i<nF;i++)pre[i+1]=pre[i]+x[i];
    for(let i=1;i<nF-1;i++){const lo=Math.max(0,i-W),hi=Math.min(nF,i+W+1),m=(pre[hi]-pre[lo])/(hi-lo);
      if(x[i]>x[i-1]&&x[i]>=x[i+1]&&x[i]>m*1.6+pk*.08&&i-last>gap){ons.push({t:i/fps,b:k,s:Math.min(1,(x[i]-m)/(pk*.9))});last=i}}});
  const O=new Float32Array(nF);F.forEach(x=>{const pk=p95(x);for(let i=0;i<nF;i++)O[i]+=Math.min(2,x[i]/pk)});
  const lo=Math.round(fps*60/180),hi=Math.round(fps*60/70),AC=new Float32Array(hi+2);let best=0,bl=lo;
  for(let l=lo;l<=hi+1;l++){let s=0;for(let i=0;i+l<nF;i++)s+=O[i]*O[i+l];s/=(nF-l);const bpm=60*fps/l;AC[l]=s*Math.exp(-Math.pow(Math.log2(bpm/120),2)/.5);if(l<=hi&&AC[l]>best){best=AC[l];bl=l}}
  const y0=AC[bl-1],y1=AC[bl],y2=AC[bl+1],d=y0-2*y1+y2,T=bl+(d?.5*(y0-y2)/d:0);
  let bp=0,bs=-1;for(let p=0;p<T;p++){let s=0;for(let t=p;t<nF;t+=T)s+=O[Math.round(t)];if(s>bs){bs=s;bp=p}}
  const beats=[];let t=bp;const w=Math.round(T*.12);
  while(t<nF-1){const c=Math.round(t);let m=c,mv=-1;for(let j=Math.max(0,c-w);j<=Math.min(nF-1,c+w);j++)if(O[j]>mv){mv=O[j];m=j}
    t+=(m-c)*.3;beats.push(t/fps);t+=T}
  const sc=[0,0,0,0];beats.forEach((tb,i)=>sc[i%4]+=ne[0][Math.min(nF-1,Math.round(tb*fps))]);const db=sc.indexOf(Math.max(...sc));
  beats.forEach((tb,i)=>ons.push({t:tb,b:4,s:i%4===db?1:.5}));
  return{dur:buf.duration,fps,ne,ev:ons.sort((x,y)=>x.t-y.t),bpm:60*fps/T};
}
function makeDemo(){const fps=60,dur=16,ev=[],ne=[0,1,2,3].map(()=>new Float32Array(fps*dur)),bt=60/118;
  for(let i=0;i*bt<dur;i++){const t=i*bt;ev.push({t,b:4,s:i%4?.5:1},{t,b:0,s:.85},{t:t+bt/2,b:3,s:.45},{t:t+bt/2,b:2,s:.5});if(i%2)ev.push({t,b:1,s:.7})}

const _p=new THREE.Vector3(),_n=new THREE.Vector3();
function proj(k){const mw=model.matrixWorld;_p.set(SP[k*3],SP[k*3+1],SP[k*3+2]).applyMatrix4(mw);_n.set(SN[k*3],SN[k*3+1],SN[k*3+2]).transformDirection(mw);

async function begin(){

  dustU.uT.value=RT;dustU.uDY.value=S.dustY;dustU.uK.value=S.beam;dustU.uDust.value=S.dust;dustU.uL.value=S.light;dustU.uPx.value=dpr;

{const g=document.createElement('canvas');g.width=g.height=180;const x=g.getContext('2d'),im=x.createImageData(180,180);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
